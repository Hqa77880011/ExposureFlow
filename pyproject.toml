[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exposureflow"
version = "0.1.0"
description = "ExposureFlow implementation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "torch>=2.2", "matplotlib>=3.7"]

[project.scripts]
exposureflow = "exposureflow.cli:main"

[tool.setuptools.packages.find]
include = ["exposureflow*"]
